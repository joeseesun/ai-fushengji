server {
    listen 80;
    server_name fusheng.qiaomu.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/qiaomu-apps/ai-fushengji/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name fusheng.qiaomu.ai;
    root /opt/qiaomu-apps/ai-fushengji/current;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/fusheng.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fusheng.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /www/wwwlogs/fusheng.qiaomu.ai.log;
    error_log /www/wwwlogs/fusheng.qiaomu.ai.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/qiaomu-apps/ai-fushengji/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /version.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
