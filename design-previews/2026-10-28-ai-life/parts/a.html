<style>

  .dir-a .a-heading span:nth-child(n+2) { justify-content:flex-end; padding:0 8px 0 0; }
  .dir-a .a-row > span:nth-child(n+2) { text-align:right; font-family:"Courier New",monospace; font-size:12px; }
  .dir-a .a-selected { background:#000080; color:#fff; }
  .dir-a .a-down { color:#a00000; }
  .dir-a .a-up { color:#087335; }

  .dir-a .a-alert-icon { flex-shrink:0; width:23px; height:23px; display:grid; place-items:center; background:#ffff00; border:1px solid #222; font:bold 18px/1 "Courier New",monospace; }
  .dir-a .a-alert strong { display:block; margin-bottom:2px; font-size:9px; font-weight:normal; color:#64633c; }
  .dir-a .a-alert p { margin:0; font-size:10px; line-height:1.45; }
  .dir-a .a-actions { display:flex; gap:7px; align-items:center; margin-top:auto; }
  .dir-a .a-hint { flex:1; min-width:0; font-size:9px; color:#555; }
  .dir-a button { color:#111; background:#c0c0c0; border:2px solid; border-color:#fff #404040 #404040 #fff; border-radius:0; box-shadow:1px 1px 0 #000; font:11px Tahoma,"Microsoft YaHei",sans-serif; padding:5px 11px; min-width:65px; white-space:nowrap; }
  .dir-a .a-primary { outline:1px solid #000; outline-offset:1px; }
  .dir-a .a-status { height:18px; flex-shrink:0; display:flex; gap:3px; color:#333; font-size:9px; }
  .dir-a .a-status span { border:1px solid; border-color:#808080 #fff #fff #808080; padding:1px 5px; }
